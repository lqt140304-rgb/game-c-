<script type="module">
import * as T from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
window.ZM=+(new URLSearchParams(location.search).get("zm")||1.7);window.EL=+(new URLSearchParams(location.search).get('el')||.45);const id=new URLSearchParams(location.search).get('id');
const r=new T.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.setSize(1200,300,false);r.setScissorTest(true);

const sc=new T.Scene();const pm=new T.PMREMGenerator(r);sc.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;sc.add(new T.HemisphereLight(0xffffff,0x888888,0.6));const d=new T.DirectionalLight(0xffffff,2.5);d.position.set(3,5,4);sc.add(d);

 const b=new T.Box3().setFromObject(m),s=b.getSize(new T.Vector3()),ce=b.getCenter(new T.Vector3());window.size=s.toArray();
